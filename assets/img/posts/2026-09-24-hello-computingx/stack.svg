<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a3a"/>
      <stop offset="1" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#00c6fb"/>
    </linearGradient>
    <linearGradient id="fw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43e97b"/>
      <stop offset="1" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="os" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fa709a"/>
      <stop offset="1" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="hw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79081"/>
      <stop offset="1" stop-color="#dfa579"/>
    </linearGradient>
  </defs>

  <rect width="760" height="420" rx="14" fill="url(#bg)"/>

  <text x="380" y="46" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#ecf0f1">Computing Stack</text>

  <!-- Application -->
  <rect x="90" y="70" width="580" height="64" rx="10" fill="url(#app)"/>
  <text x="380" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#082032">Application</text>

  <!-- Framework -->
  <rect x="90" y="150" width="580" height="64" rx="10" fill="url(#fw)"/>
  <text x="380" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#082032">Framework / Runtime</text>

  <!-- OS -->
  <rect x="90" y="230" width="580" height="64" rx="10" fill="url(#os)"/>
  <text x="380" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#082032">Operating System</text>

  <!-- Hardware -->
  <rect x="90" y="310" width="580" height="64" rx="10" fill="url(#hw)"/>
  <text x="380" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#082032">Hardware (CPU / GPU / NPU)</text>

  <!-- Arrows -->
  <g stroke="#ecf0f1" stroke-width="2" fill="#ecf0f1" opacity="0.85">
    <path d="M380 134 v12" stroke-linecap="round"/>
    <path d="M375 142 l5 8 l5 -8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M380 214 v12" stroke-linecap="round"/>
    <path d="M375 222 l5 8 l5 -8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M380 294 v12" stroke-linecap="round"/>
    <path d="M375 302 l5 8 l5 -8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- URL badge -->
  <rect x="230" y="392" width="300" height="22" rx="11" fill="#00000055"/>
  <text x="380" y="407" text-anchor="middle" font-family="Menlo, monospace"
        font-size="12" fill="#bdc3c7">www.spaceintelligence.tech</text>
</svg>
